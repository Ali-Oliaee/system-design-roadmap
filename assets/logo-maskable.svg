<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="System Design Roadmap">
  <title>System Design Roadmap</title>
  <defs>
    <linearGradient id="m-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset=".4" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <mask id="m-nodes">
      <rect width="64" height="64" fill="#fff"/>
      <g transform="translate(9.6 9.6) scale(.7)">
        <circle cx="14" cy="33" r="2.3" fill="#000"/>
        <circle cx="26" cy="45" r="2.3" fill="#000"/>
        <circle cx="50" cy="19" r="2.3" fill="#000"/>
      </g>
    </mask>
  </defs>

  <!-- full bleed: launchers crop this to a circle or squircle, so art stays in the safe zone -->
  <rect width="64" height="64" fill="url(#m-tile)"/>

  <g transform="translate(9.6 9.6) scale(.7)">
    <g stroke="#fff" stroke-opacity=".3" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M13 14 14 33"/>
      <path d="M53 36 50 19"/>
      <path d="M41 53 26 45"/>
      <path d="M11 48 14 33"/>
      <path d="M53 36 41 53"/>
    </g>
    <g fill="#fff" fill-opacity=".42">
      <circle cx="13" cy="14" r="2.8"/>
      <circle cx="53" cy="36" r="2.8"/>
      <circle cx="41" cy="53" r="2.8"/>
      <circle cx="11" cy="48" r="2.8"/>
    </g>
  </g>

  <g mask="url(#m-nodes)">
    <g transform="translate(9.6 9.6) scale(.7)">
      <path d="M14 33 26 45 50 19" fill="none" stroke="#fff"
            stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#fff">
        <circle cx="14" cy="33" r="5.5"/>
        <circle cx="26" cy="45" r="5.5"/>
        <circle cx="50" cy="19" r="5.5"/>
      </g>
    </g>
  </g>
</svg>
