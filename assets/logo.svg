<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="System Design Roadmap">
  <title>System Design Roadmap</title>
  <defs>
    <linearGradient id="l-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset=".4" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="l-sheen" x1=".15" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- punches the node centres out of the mark so they read as nodes, not blobs -->
    <mask id="l-nodes">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="14" cy="33" r="2.3" fill="#000"/>
      <circle cx="26" cy="45" r="2.3" fill="#000"/>
      <circle cx="50" cy="19" r="2.3" fill="#000"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#l-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#l-sheen)"/>

  <!-- the surrounding system: the checked route is one path through a larger graph -->
  <g stroke="#fff" stroke-opacity=".3" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M13 14 14 33"/>
    <path d="M53 36 50 19"/>
    <path d="M41 53 26 45"/>
    <path d="M11 48 14 33"/>
    <path d="M53 36 41 53"/>
  </g>
  <g fill="#fff" fill-opacity=".42">
    <circle cx="13" cy="14" r="2.8"/>
    <circle cx="53" cy="36" r="2.8"/>
    <circle cx="41" cy="53" r="2.8"/>
    <circle cx="11" cy="48" r="2.8"/>
  </g>

  <!-- the completed route -->
  <g mask="url(#l-nodes)">
    <path d="M14 33 26 45 50 19" fill="none" stroke="#fff"
          stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fff">
      <circle cx="14" cy="33" r="5.5"/>
      <circle cx="26" cy="45" r="5.5"/>
      <circle cx="50" cy="19" r="5.5"/>
    </g>
  </g>

  <rect x=".6" y=".6" width="62.8" height="62.8" rx="14.4" fill="none"
        stroke="#fff" stroke-opacity=".18" stroke-width="1.2"/>
</svg>
