<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="System Design Roadmap">
  <title>System Design Roadmap</title>
  <defs>
    <linearGradient id="f-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset=".4" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#f-tile)"/>

  <!-- checkmark traced through three service nodes; solid nodes stay legible at 16px -->
  <path d="M14 33 26 45 50 19" fill="none" stroke="#fff"
        stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff">
    <circle cx="14" cy="33" r="6"/>
    <circle cx="26" cy="45" r="6"/>
    <circle cx="50" cy="19" r="6"/>
  </g>
</svg>
